<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1460px;
      height: 820px;
      margin: 0;
      overflow: hidden;
      background: #e9e6de;
      color: #101010;
      font-family: Arial, sans-serif;
    }
    body { padding: 32px 46px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 27px; letter-spacing: -.035em; }
    header p { margin: 0; color: #68645d; font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 38px;
      height: 710px;
    }
    figure {
      position: relative;
      margin: 0;
      padding: 48px 20px 18px;
      background: #f6f3ec;
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }
    figcaption {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .08em;
    }
    figure p {
      position: absolute;
      top: 15px;
      right: 20px;
      margin: 0;
      color: #777;
      font-size: 12px;
    }
    img {
      width: 100%;
      height: 644px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <h1>SVATS CRICKET CUP 2026 — GENERATION COMPARISON</h1>
    <p>RAW GENERATION VS. REUSABLE EVENT TEMPLATE</p>
  </header>
  <main>
    <figure>
      <figcaption>RAW IDEOGRAM</figcaption>
      <p>FULL EVENT BRIEF</p>
      <img src="{{ raw_url }}" alt="">
    </figure>
    <figure>
      <figcaption>HYBRID PRODUCTION</figcaption>
      <p>IDEOGRAM ART + EXACT HTML TEXT</p>
      <img src="{{ hybrid_url }}" alt="">
    </figure>
  </main>
</body>
</html>
