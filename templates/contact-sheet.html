<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1500px;
      height: 760px;
      margin: 0;
      overflow: hidden;
      background: #e8e6df;
      font-family: Arial, sans-serif;
    }
    body { padding: 38px; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 0; color: #666; font-size: 14px; }
    main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }
    figure { margin: 0; }
    img {
      display: block;
      width: 100%;
      height: 590px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,.2));
    }
  </style>
</head>
<body>
  <header>
    <h1>CRICKET POST STUDIO — STARTER SYSTEM</h1>
    <p>INFORMATION / REGISTRATION / SERVICES · 1080 × 1350</p>
  </header>
  <main>
    {% for image in images %}<figure><img src="{{ image }}" alt=""></figure>{% endfor %}
  </main>
</body>
</html>
